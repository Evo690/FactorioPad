name: Build Companion (Fast)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-template:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16
        run: |
          XCODE_APP=$(find /Applications -maxdepth 1 -name 'Xcode_16*.app' 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$XCODE_APP" ]; then
            echo "Switching to $XCODE_APP"
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          fi
          xcodebuild -version
      - name: Download base template IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build-input
          gh release download --repo MyNameIsArko/FactorioPad --pattern FactorioPad-template.ipa --dir build-input
        shell: bash
      - name: Setup build prerequisites
        run: |
          mkdir -p Vendor/FactorioData/base/scenarios/freeplay
          touch Vendor/FactorioData/cacert.pem
          mkdir -p Vendor/FactorioGuest.framework
          touch Vendor/FactorioGuest.framework/FactorioGuest
          python3 -c "
          import zipfile, pathlib
          with zipfile.ZipFile('build-input/FactorioPad-template.ipa', 'r') as z:
              for name in z.namelist():
                  if 'AppIcon' in name and name.endswith('.png'):
                      pathlib.Path('FactorioPad/Assets.xcassets/AppIcon.appiconset/icon.png').write_bytes(z.read(name))
                      print(f'Extracted icon from {name}')
                      break
          "
      - name: Build FactorioPad and FactorioCompat
        run: |
          xcodebuild -project FactorioPad.xcodeproj -scheme FactorioPad \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_INJECT_BASE_ENTITLEMENTS=NO build

      - name: Inject updated FactorioPad binary and FactorioCompat framework into template IPA
        run: |
          COMPAT_FW=$(find build/DerivedData -name "FactorioCompat.framework" -type d | head -n 1)
          APP_BIN=$(find build/DerivedData -path "*/FactorioPad.app/FactorioPad" -type f | head -n 1)
          echo "Found FactorioCompat framework at: $COMPAT_FW"
          echo "Found FactorioPad executable at: $APP_BIN"
          if [ -z "$APP_BIN" ]; then
            echo "ERROR: FactorioPad app binary was not built!"
            exit 1
          fi
          if [ -z "$COMPAT_FW" ]; then
            echo "ERROR: FactorioCompat framework was not built!"
            exit 1
          fi
          python3 Tools/inject_compat.py \
            build-input/FactorioPad-template.ipa \
            "$COMPAT_FW" \
            build-input/FactorioPad-template.ipa \
            "$APP_BIN"
      - uses: actions/upload-artifact@v4
        with:
          name: FactorioPad-template-ipa
          path: build-input/FactorioPad-template.ipa
          if-no-files-found: error

  build-companions:
    needs: prepare-template
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: Windows-x64
          - os: macos-14
            platform: macOS-arm64
          - os: ubuntu-22.04
            platform: Linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install desktop libraries on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Install build tools
        run: uv sync --locked
      - name: Download prepared template IPA
        uses: actions/download-artifact@v4
        with:
          name: FactorioPad-template-ipa
          path: build-input
      - name: Build companion release
        if: runner.os != 'Linux'
        run: uv run --frozen python Tools/build_companion.py --template build-input/FactorioPad-template.ipa
      - name: Build companion release on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run --frozen python Tools/build_companion.py --template build-input/FactorioPad-template.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: FactorioPad-Companion-${{ matrix.platform }}
          path: dist/FactorioPad-Companion-*
          if-no-files-found: error
